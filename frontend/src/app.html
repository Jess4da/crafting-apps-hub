<!DOCTYPE html>
<html lang="en" data-theme="glass">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hub.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crafting Apps Hub</title>
    <script>
      // The Go side loads /?glass=1 only when the OS window material exists.
      // Mark it before paint so the window never flashes the fallback surface.
      if (new URLSearchParams(location.search).has("glass")) document.documentElement.classList.add("os-glass");
      // macOS overlays the traffic lights on the hidden title bar; the narrow
      // rail reserves room for them.
      if (navigator.userAgent.includes("Mac")) document.documentElement.classList.add("mac");
      // Focus rings only after keyboard navigation (see layout.css): menus move
      // focus by script, which Chromium otherwise rings after a mouse click.
      const root = document.documentElement;
      addEventListener("keydown", (e) => { if (e.key === "Tab" || e.key.startsWith("Arrow")) root.dataset.kbd = ""; }, true);
      addEventListener("pointerdown", () => delete root.dataset.kbd, true);
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
