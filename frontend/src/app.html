<!DOCTYPE html>
<html lang="en" data-theme="atelier">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icons/photocraft.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crafting Apps Hub</title>
    <script>
      // Paper (light) is the default; apply a saved dark preference before paint.
      if (localStorage.getItem("mode") === "dark") document.documentElement.classList.add("dark");
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
