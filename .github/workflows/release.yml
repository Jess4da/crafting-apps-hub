# Tag push `vX.Y.Z` → test, build Windows/Linux/macOS, publish a GitHub release with SHA256SUMS.txt.
# The tag is the version: VERSION (tag minus "v") feeds `-ldflags -X main.version` and the
# Info.plist/info.json build assets via the Taskfiles. Manual runs use build/config.yml and publish nothing.
# ponytail: unsigned binaries, x64 Linux/Windows only; add signing secrets / arm64 runners when needed.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  WAILS_VERSION: v3.0.0-beta.28
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      # VERSION is still "vX.Y.Z" here; strip it, then let TestVersionIsSemVer reject a bad tag.
      - run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      # Wails' Linux webview packages need GTK4/WebKitGTK headers even for vet/test.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: mkdir -p frontend/dist && touch frontend/dist/.keep # go:embed needs the dir; tests don't use the UI
      - run: go vet ./...
      # Under `go test` package main links as "craftinghub"; empty VERSION falls back to config.yml.
      - run: go test -ldflags "-X craftinghub.version=$VERSION" ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - { os: windows-latest, asset: windows-x64 }
          - { os: ubuntu-24.04, asset: linux-x64 }
          - { os: macos-latest, asset: macos-universal }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - uses: oven-sh/setup-bun@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
      - name: Build
        run: |
          export VERSION="${VERSION#v}"
          [ -z "$VERSION" ] || wails3 task common:update:build-assets
          mkdir dist
          NAME="crafting-apps-hub-${GITHUB_REF_NAME}-${{ matrix.asset }}"
          case "${{ runner.os }}" in
            Windows) wails3 build && (cd bin && 7z a -tzip "../dist/$NAME.zip" "Crafting Apps Hub.exe") ;;
            Linux)   wails3 build && tar -czf "dist/$NAME.tar.gz" -C bin "Crafting Apps Hub" ;;
            macOS)   wails3 task darwin:package:universal && ditto -c -k --keepParent "bin/Crafting Apps Hub.app" "dist/$NAME.zip" ;;
          esac
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/*

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4 # for build/updater.pub
      - uses: actions/setup-go@v5
        with: { go-version: "1.25" }
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@$WAILS_VERSION
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      # Ed25519ph signature per archive, as <asset>.sig (base64), which the hub's self-updater requires.
      # The manifest is only a vehicle for sign + verify; verifying against the committed build/updater.pub
      # fails the release if the secret and the key pinned in the app ever diverge.
      - name: Sign
        env:
          UPDATER_SIGNING_KEY: ${{ secrets.UPDATER_SIGNING_KEY }}
        run: |
          [ -n "$UPDATER_SIGNING_KEY" ] || { echo "UPDATER_SIGNING_KEY secret is not set"; exit 1; }
          key="$RUNNER_TEMP/updater.key"
          (umask 077; printf '%s\n' "$UPDATER_SIGNING_KEY" > "$key")
          wails3 updater manifest -version "$VERSION" -key "$key" -output "$RUNNER_TEMP/manifest.json" dist
          rm -f "$key"
          wails3 updater verify -manifest "$RUNNER_TEMP/manifest.json" -publickey build/updater.pub -dir dist
          jq -r '.artifacts[] | "\(.url) \(.signature)"' "$RUNNER_TEMP/manifest.json" | while read -r f s; do printf '%s\n' "$s" > "dist/$f.sig"; done
          ls dist
      - run: cd dist && sha256sum * > SHA256SUMS.txt
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
